<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camera parity</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#fafafa, #0a0a0a);
        --card: light-dark(#fff, #141414);
        --line: light-dark(#e5e5e5, #262626);
        --muted: light-dark(#737373, #a3a3a3);
        font:
          14px/1.4 system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
      }
      body {
        margin: 0 auto;
        padding: 24px 16px 64px;
        max-width: 1400px;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      header span {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: 16px;
      }
      article {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      .head b {
        font-weight: 600;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .head small {
        color: var(--muted);
        white-space: nowrap;
      }
      .score {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        padding: 2px 8px;
        border-radius: 6px;
        color: #fff;
      }
      .shots {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        background: var(--line);
      }
      figure {
        margin: 0;
        background: #000;
        position: relative;
      }
      figure img {
        display: block;
        width: 100%;
      }
      figcaption {
        position: absolute;
        left: 6px;
        top: 6px;
        font-size: 11px;
        color: #fff;
        background: #0009;
        padding: 1px 6px;
        border-radius: 4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 24px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        font-variant-numeric: tabular-nums;
      }
      td,
      th {
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      tr[data-name] {
        cursor: pointer;
      }
      tr[aria-selected="true"] {
        background: light-dark(#f0f0f0, #1f1f1f);
      }
      td.about {
        white-space: normal;
        color: var(--muted);
      }
      .bar {
        width: 160px;
        height: 8px;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
      }
      a {
        color: inherit;
      }
      .marks {
        margin: 0;
        padding: 8px 14px;
        list-style: none;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .marks li {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .marks b {
        display: inline-block;
        width: 52px;
      }
      #worst {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      #worst figure {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      #worst img {
        height: 120px;
        object-fit: contain;
        background: #000;
      }
      #worst figcaption {
        position: static;
        background: none;
        color: inherit;
        font-size: 12px;
        padding: 8px 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Camera parity</h1>
      <span id="summary"></span>
    </header>
    <table>
      <thead>
        <tr>
          <th>Component</th>
          <th>Score</th>
          <th></th>
          <th>Pixels</th>
          <th>Elements</th>
          <th>States</th>
          <th>Duo</th>
          <th>What it is</th>
        </tr>
      </thead>
      <tbody id="components"></tbody>
    </table>
    <header>
      <h1>Worst elements</h1>
      <span>Apple left, ours right</span>
    </header>
    <section id="worst"></section>
    <header>
      <h1 id="title">All states</h1>
      <span id="count"></span>
    </header>
    <main id="board"></main>
    <script type="module">
      const {
        score,
        simulator,
        duo,
        components,
        states,
        worst = [],
      } = await fetch("camera-parity/results.json", {
        cache: "no-store",
      }).then((r) => r.json());
      const updated = new Date(Math.max(...states.map((r) => r.time))).toLocaleString();
      document.querySelector("#summary").textContent =
        `${states.length} states · ${score.toFixed(1)}% overall · simulator ${simulator.toFixed(1)}% · Duo ${duo.toFixed(1)}% · updated ${updated}`;
      const hue = (score) => `hsl(${Math.max(0, score - 50) * 2.4} 70% 42%)`;
      const img = (r, kind) => `camera-parity/${r.id}-${kind}.png?v=${r.time}`;
      const tbody = document.querySelector("#components");
      tbody.innerHTML = components
        .map(
          (c) => `<tr data-name="${c.name}">
            <td><b>${c.name}</b></td>
            <td>${c.score.toFixed(1)}%</td>
            <td><div class="bar"><i style="width:${c.score}%;background:${hue(c.score)}"></i></div></td>
            <td>${c.pixels?.toFixed(1) ?? "–"}%</td>
            <td>${c.elements === null || c.elements === undefined ? "–" : `${c.elements.toFixed(1)}%`}</td>
            <td>${c.states}</td>
            <td>${c.duo === null ? "–" : `${c.duo.toFixed(1)}%`}</td>
            <td class="about">${c.about}</td>
          </tr>`,
        )
        .join("");
      const where = ({ x, y, w, h }) => `${x},${y} ${w}×${h}pt`;
      const off = ([dx, dy]) => (dx || dy ? ` · ours off ${dx},${dy}pt` : "");
      document.querySelector("#worst").innerHTML = worst
        .slice(0, 24)
        .map(
          (m) => `<figure>
            <a href="camera-parity/${m.crop}"><img loading="lazy" src="camera-parity/${m.crop}" alt=""></a>
            <figcaption><b>${m.score.toFixed(1)}%</b> ${m.element}<br>${m.id} · ${where(m.box)}${off(m.shift)}</figcaption>
          </figure>`,
        )
        .join("");
      function show(name) {
        const rows = name
          ? states
              .filter((r) => r.components[name])
              .map((r) => ({ r, score: r.components[name].score }))
              .toSorted((a, b) => a.score - b.score)
          : states.map((r) => ({ r, score: r.score }));
        document.querySelector("#title").textContent = name ?? "All states";
        document.querySelector("#count").textContent = `${rows.length} states, worst first`;
        for (const tr of tbody.querySelectorAll("tr")) tr.setAttribute("aria-selected", tr.dataset.name === name);
        document.querySelector("#board").innerHTML = rows
          .map(
            ({ r, score }) => `<article>
            <div class="head">
              <b>${r.id}</b>
              <small>${r.profile} · ${r.display} · ${r.orientation}</small>
              <span class="score" style="background:${hue(score)}">${score.toFixed(1)}%</span>
            </div>
            <div class="shots">
              <figure><a href="${img(r, "apple")}"><img loading="lazy" src="${img(r, "apple")}" alt=""></a><figcaption>Apple</figcaption></figure>
              <figure><a href="${img(r, "ours")}"><img loading="lazy" src="${img(r, "ours")}" alt=""></a><figcaption>Ours</figcaption></figure>
              <figure><a href="${img(r, "diff")}"><img loading="lazy" src="${img(r, "diff")}" alt=""></a><figcaption>Diff</figcaption></figure>
            </div>
            <ul class="marks">${(r.marks ?? [])
              .filter((m) => !name || m.components.includes(name))
              .slice(0, 3)
              .map((m) => `<li><b>${m.score.toFixed(1)}%</b>${m.element} · ${where(m.box)}${off(m.shift)}</li>`)
              .join("")}</ul>
          </article>`,
          )
          .join("");
      }
      tbody.addEventListener("click", (e) => {
        const name = e.target.closest("tr")?.dataset.name;
        const current = new URLSearchParams(location.search).get("component");
        const next = name === current ? null : name;
        history.replaceState(null, "", next ? `?component=${next}` : location.pathname);
        show(next);
      });
      show(new URLSearchParams(location.search).get("component"));
    </script>
  </body>
</html>
