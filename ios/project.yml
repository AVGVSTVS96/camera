name: Camera
packages:
  PhotosBrowser:
    path: PhotosBrowser
options:
  bundleIdPrefix: com.bassim
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    IPHONEOS_DEPLOYMENT_TARGET: "27.1"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: 6SV62PQ76B
targets:
  Camera:
    type: application
    platform: iOS
    sources:
      - path: Camera
    dependencies:
      - package: PhotosBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bassim.camera
        INFOPLIST_FILE: Camera/Info.plist
        PRODUCT_NAME: Camera
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Camera Lab
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Camera access is required to take photos and videos.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Microphone access is required to record video with sound.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Photo library access is required to save your photos and videos.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Photo library access is required to view captured photos.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Location access lets you include the capture location in your photos and videos.
        DEVELOPMENT_ASSET_PATHS: "\"Camera/Preview Content\""
        CODE_SIGN_STYLE: Automatic
